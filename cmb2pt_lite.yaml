likelihood:
  planck_NPIPE_highl_CamSpec.TTTEEE:
    dataset_params:
      use_cl: 143x143 217x217 143x217 TE EE
      use_range:
        143x143: 30-1000
        217x217: 500-1000
        143x217: 500-1000
        TE: 30-1000
        EE: 30-1000
  act_dr6_lite:
    class: candl.interface.CandlCobayaLikelihood
    data_set_file: candl_data.ACT_DR6_TTTEEE
    data_selection:
      - "ell<1000 remove"
      - "ell>4000 remove"
  spt_3g_d1_lite:
    class: candl.interface.CandlCobayaLikelihood
    data_set_file: spt_candl_data.SPT3G_D1_TnE
    variant: lite

theory:
  camb:

sampler:
  mcmc:

output: chains/cmb2pt_lite

prior:
  cal_dip_prior: 'lambda A_act: stats.norm.logpdf(A_act, loc = 1.0, scale = 0.003)'
  poleff_prior:  'lambda P_act: stats.norm.logpdf(P_act, loc=1.0, scale=0.01)'
  gaussian_Tcal: 'lambda Tcal: stats.norm.logpdf(Tcal, loc=1.0, scale=0.0036)'

params:
  # Cosmology
  ombh2:
    prior:
      min: 0.017
      max: 0.027
    ref:
      dist: norm
      loc: 2.237e-2
      scale: 3e-4
    proposal: 1.5e-4
    latex: \Omega_\mathrm{b}h^2
  omch2:
    prior:
      min: 0.09
      max: 0.15
    ref:
      dist: norm
      loc: 12.00e-2
      scale: 2.4e-3
    proposal: 1.2e-3
    latex: \Omega_\mathrm{c}h^2
  cosmomc_theta:
    prior:
      min: 103.8e-4
      max: 104.4e-4
    ref:
      dist: norm
      loc: 104.092e-4
      scale: 6.2e-6
    proposal: 3.1e-6
    latex: \theta_\mathrm{MC}
  logA:
    prior:
      min: 2.6
      max: 3.5
    ref:
      dist: norm
      loc: 3.044
      scale: 2.8e-2
    proposal: 1.4e-2
    latex: \log(10^{10} A_\mathrm{s})
  ns:
    prior:
      min: 0.9
      max: 1.1
    ref:
      dist: norm
      loc: 0.9649
      scale: 8.4e-3
    proposal: 4.2e-3
    latex: n_\mathrm{s}
  tau:
    value: 0.08
    latex: \tau_\mathrm{reio}
  mnu:
    value: 0.06
    latex: \Sigma m_\nu
  H0:
    latex: H_0
  sigma8:
    latex: \sigma_8
  YHe:
    latex: Y_\mathrm{He}
    derived: true
  zrei:
    latex: z_\mathrm{reio}
    derived: true
  zstar:
    latex: z_\star
    derived: true
  rstar:
    latex: r_{s,\star}
    derived: true
  zdrag:
    latex: z_d
    derived: true
  rdrag:
    latex: r_d
    derived: true
  omnuh2:
    latex: \Omega_\nuh^2
    derived: true
  OmegaM:
    derived: "lambda omch2,ombh2,omnuh2,H0: (omch2+ombh2+omnuh2)/(H0/100)**2"
    latex: \Omega_\mathrm{m}
  H0rd: 
    derived: "lambda H0, rdrag: H0*rdrag/100"
    latex: H_0r_d
  S8:
    derived: 'lambda OmegaM, sigma8: sigma8*(OmegaM/0.3)**0.5'
    latex: S_8
  As:
    value: "lambda logA: 1e-10*np.exp(logA)"
    latex: A_s
    derived: true
  # ACT calibration
  A_act:
    latex: A_{\rm act}
    prior:
      max: 1.2
      min: 0.8
    ref: 1.0
  P_act:
    prior: {min: 0.9, max: 1.1}
    ref: {dist: norm, loc: 1.0, scale: 0.01}
    proposal: 0.01
    latex: P_{\rm act}
  # SPT calibration
  Tcal:
    latex: T_{\rm cal}
    prior:
      max: 1.2
      min: 0.8
    ref: 1.0
  Ecal:
    latex: E_{\rm cal}
    prior:
      max: 1.2
      min: 0.8
    ref: 1.0